name: Check Daily Signed-Up Events

on:
  schedule:
    # Run daily at 20:00 UTC (22:00 CEST in summer / 21:00 CET in winter - Amsterdam time)
    - cron: '0 20 * * *'  # 22:00 Amsterdam time
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to check (YYYY-MM-DD). Leave empty to use today.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-events:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check signed-up events and save workouts
        env:
          SPORTBIT_USER: ${{ secrets.SPORTBIT_USER }}
          SPORTBIT_PASS: ${{ secrets.SPORTBIT_PASS }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -z "$INPUT_DATE" ]; then
            CHECK_DATE=$(date -u +%Y-%m-%d)
          else
            CHECK_DATE="$INPUT_DATE"
          fi
          python3 sportbit_client.py --date "$CHECK_DATE" --save ./workouts

      - name: Commit and push workouts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workouts/
          git commit -m "Add workouts for $(date -u +%Y-%m-%d)" || true
          git push
