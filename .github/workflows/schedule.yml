name: Check Daily Signed-Up Events

on:
  schedule:
    # Run daily at 20:00 UTC (22:00 CEST in summer / 21:00 CET in winter - Amsterdam time)
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  check-events:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Check today's signed-up events
        env:
          SPORTBIT_USER: ${{ secrets.SPORTBIT_USER }}
          SPORTBIT_PASS: ${{ secrets.SPORTBIT_PASS }}
        run: python3 sportbit_client.py --date $(date -u +%Y-%m-%d)
