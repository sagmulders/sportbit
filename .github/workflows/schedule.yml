name: Check Daily Signed-Up Events

on:
  schedule:
    # Run daily at 20:00 UTC (22:00 CEST in summer / 21:00 CET in winter - Amsterdam time)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to check (YYYY-MM-DD). Leave empty to use today.'
        required: false
        type: string

jobs:
  check-events:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check signed-up events and save to Google Drive
        env:
          SPORTBIT_USER: ${{ secrets.SPORTBIT_USER }}
          SPORTBIT_PASS: ${{ secrets.SPORTBIT_PASS }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          CHECK_DATE: ${{ github.event.inputs.date || format(now(), 'yyyy-MM-dd') }}
        run: python3 sportbit_client.py --date $CHECK_DATE --save-to-drive
